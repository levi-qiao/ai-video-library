name: Knowledge Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source index is synchronized
        run: python3 scripts/build_index.py --check
      - name: Build derived agent retrieval index
        run: python3 scripts/build_agent_index.py
      - name: Validate agent-native architecture
        run: python3 scripts/validate_agent_architecture.py
      - name: Ensure generation is deterministic
        run: python3 scripts/build_agent_index.py --check
